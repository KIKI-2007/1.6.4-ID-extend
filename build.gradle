buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        // ForgeGradle 1.0 is the compatible toolchain for Forge 1.6.4 build 964.
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.0-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = project.hasProperty('mod_version') ? project.mod_version : '0.3.0'
def lemonApiVersion = project.hasProperty('lemon_api_version') ? project.lemon_api_version : '0.1.0'
def lemonsGuiVersion = project.hasProperty('lemons_gui_version') ? project.lemons_gui_version : '0.1.0'
group = 'com.zxl.betterid'
archivesBaseName = 'BetterIDExtender'

sourceCompatibility = 1.7
targetCompatibility = 1.7

minecraft {
    version = "1.6.4-9.11.1.964"
}

sourceSets {
    lemonApi {
        java.srcDir 'src/lemonapi/java'
        resources.srcDir 'src/lemonapi/resources'
        compileClasspath += configurations.compile
    }
    lemonsGui {
        java.srcDir 'src/lemonsgui/java'
        resources.srcDir 'src/lemonsgui/resources'
        compileClasspath += configurations.compile + sourceSets.lemonApi.output
    }
    main {
        // Compile against both prerequisite APIs without bundling either library.
        compileClasspath += sourceSets.lemonApi.output + sourceSets.lemonsGui.output
    }
}

compileLemonsGuiJava.dependsOn compileLemonApiJava
compileJava.dependsOn compileLemonsGuiJava

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.6.4"
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.6.4'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

processLemonApiResources {
    inputs.property "version", lemonApiVersion
    inputs.property "mcversion", "1.6.4"
    from(sourceSets.lemonApi.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': lemonApiVersion, 'mcversion': '1.6.4'
    }
    from(sourceSets.lemonApi.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

processLemonsGuiResources {
    inputs.property "version", lemonsGuiVersion
    inputs.property "mcversion", "1.6.4"
    from(sourceSets.lemonsGui.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': lemonsGuiVersion, 'mcversion': '1.6.4'
    }
    from(sourceSets.lemonsGui.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.zxl.betterid.BetterIDLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'Implementation-Title': 'Better ID Extender',
            'Implementation-Version': project.version
        )
    }
}

task lemonApiJar(type: Jar, dependsOn: lemonApiClasses) {
    from sourceSets.lemonApi.output
    archiveName = "LemonAPI-${lemonApiVersion}.jar"
    manifest {
        attributes(
            'Implementation-Title': 'Lemon API',
            'Implementation-Version': lemonApiVersion
        )
    }
}

task lemonsGuiJar(type: Jar, dependsOn: lemonsGuiClasses) {
    from sourceSets.lemonsGui.output
    archiveName = "LemonsGUI-${lemonsGuiVersion}.jar"
    manifest {
        attributes(
            'Implementation-Title': "Lemon's GUI",
            'Implementation-Version': lemonsGuiVersion
        )
    }
}

artifacts {
    archives lemonApiJar
    archives lemonsGuiJar
}
