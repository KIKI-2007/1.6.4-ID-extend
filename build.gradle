buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        // ForgeGradle 1.0 is the compatible toolchain for Forge 1.6.4 build 964.
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.0-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = project.hasProperty('mod_version') ? project.mod_version : '0.2.0'
def lemonApiVersion = project.hasProperty('lemon_api_version') ? project.lemon_api_version : '0.1.0'
group = 'com.zxl.betterid'
archivesBaseName = 'BetterIDExtender'

sourceCompatibility = 1.7
targetCompatibility = 1.7

minecraft {
    version = "1.6.4-9.11.1.964"
}

sourceSets {
    lemonApi {
        java.srcDir 'src/lemonapi/java'
        resources.srcDir 'src/lemonapi/resources'
        compileClasspath += configurations.compile
    }
    main {
        // Compile against Lemon API but do not bundle its classes in this JAR.
        compileClasspath += sourceSets.lemonApi.output
    }
}

compileJava.dependsOn compileLemonApiJava

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.6.4"
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.6.4'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

processLemonApiResources {
    inputs.property "version", lemonApiVersion
    inputs.property "mcversion", "1.6.4"
    from(sourceSets.lemonApi.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': lemonApiVersion, 'mcversion': '1.6.4'
    }
    from(sourceSets.lemonApi.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.zxl.betterid.BetterIDLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'Implementation-Title': 'Better ID Extender',
            'Implementation-Version': project.version
        )
    }
}

task lemonApiJar(type: Jar, dependsOn: lemonApiClasses) {
    from sourceSets.lemonApi.output
    archiveName = "LemonAPI-${lemonApiVersion}.jar"
    manifest {
        attributes(
            'Implementation-Title': 'Lemon API',
            'Implementation-Version': lemonApiVersion
        )
    }
}

artifacts {
    archives lemonApiJar
}
