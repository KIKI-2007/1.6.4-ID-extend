name: Build Better ID Extender and Lemon API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Seed legacy Minecraft 1.6.4 client and server cache
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          manifest_url = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          with urllib.request.urlopen(manifest_url, timeout=60) as response:
              manifest = json.load(response)
          version_entry = next(item for item in manifest["versions"] if item["id"] == "1.6.4")
          with urllib.request.urlopen(version_entry["url"], timeout=60) as response:
              version = json.load(response)

          cache_root = os.path.join(os.path.expanduser("~"), ".gradle", "caches", "minecraft", "net", "minecraft")
          destinations = {
              "client": os.path.join(cache_root, "minecraft", "1.6.4", "minecraft-1.6.4.jar"),
              "server": os.path.join(cache_root, "minecraft_server", "1.6.4", "minecraft_server-1.6.4.jar"),
          }
          for kind, destination in destinations.items():
              download = version.get("downloads", {}).get(kind)
              if not download:
                  raise SystemExit("Mojang metadata has no %s download for Minecraft 1.6.4" % kind)
              with urllib.request.urlopen(download["url"], timeout=120) as response:
                  data = response.read()
              actual = hashlib.sha1(data).hexdigest()
              if actual.lower() != download["sha1"].lower():
                  raise SystemExit("%s JAR SHA-1 mismatch: %s" % (kind, actual))
              os.makedirs(os.path.dirname(destination), exist_ok=True)
              with open(destination, "wb") as output:
                  output.write(data)
              print("Seeded %s cache: %s (%d bytes, SHA-1 %s)" % (kind, destination, len(data), actual))
          PY

      - name: Resolve ForgeGradle 1.0 project metadata
        run: gradle --no-daemon help

      - name: Inspect legacy checksum metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import zipfile

          roots = [
              os.path.join(os.path.expanduser("~"), ".gradle", "caches", "modules-2", "files-2.1"),
              os.path.join(os.path.expanduser("~"), ".gradle", "caches", "minecraft"),
          ]
          found = False
          for root in roots:
              for path in glob.glob(root + "/**/*.jar", recursive=True):
                  try:
                      with zipfile.ZipFile(path) as archive:
                          for name in archive.namelist():
                              if "mc_versions" in name.lower():
                                  found = True
                                  print("FOUND", path, "=>", name)
                                  if name.lower().endswith("mc_versions.cfg"):
                                      content = archive.read(name).decode("utf-8", "replace")
                                      lines = content.splitlines()
                                      for index, line in enumerate(lines):
                                          if line.strip() == "[1.6.4]":
                                              print("\n".join(lines[index:index+12]))
                  except (zipfile.BadZipFile, OSError):
                      pass
          if not found:
              print("No mc_versions metadata file found in resolved Gradle cache JARs.")
          PY

      - name: Build Forge 1.6.4 mods
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean build lemonApiJar \
            -x getAssetsIndex -x getAssets -x downloadClient -x downloadServer \
            2>&1 | tee forge164-build.log

      - name: Verify Better ID Extender JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="build/libs/BetterIDExtender-0.2.0.jar"
          test -f "$jar_file"
          unzip -p "$jar_file" META-INF/MANIFEST.MF | tr -d '\r' | grep -F 'FMLCorePlugin: com.zxl.betterid.BetterIDLoadingPlugin'
          unzip -p "$jar_file" META-INF/MANIFEST.MF | tr -d '\r' | grep -F 'FMLCorePluginContainsFMLMod: true'
          jar tf "$jar_file" | grep -Fx 'com/zxl/betterid/BetterIDMod.class'
          jar tf "$jar_file" | grep -Fx 'com/zxl/betterid/transformer/BetterIDTransformer.class'
          javap -classpath "$jar_file" -verbose com.zxl.betterid.BetterIDMod | grep -F 'major version: 51'
          unzip -p "$jar_file" mcmod.info | grep -F 'required-after:lemonapi'

      - name: Verify Lemon API prerequisite JAR
        shell: bash
        run: |
          set -euo pipefail
          api_jar="build/libs/LemonAPI-0.1.0.jar"
          test -f "$api_jar"
          jar tf "$api_jar" | grep -Fx 'com/zxl/lemonapi/LemonApiMod.class'
          jar tf "$api_jar" | grep -Fx 'com/zxl/lemonapi/LemonAPI.class'
          jar tf "$api_jar" | grep -Fx 'com/zxl/lemonapi/IdAllocator.class'
          unzip -p "$api_jar" mcmod.info | grep -F '"modid": "lemonapi"'
          javap -classpath "$api_jar" -verbose com.zxl.lemonapi.LemonAPI | grep -F 'major version: 51'

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-1.6.4-build-diagnostics
          path: |
            forge164-build.log
            build/reports/**
          if-no-files-found: warn

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: BetterIDExtender-1.6.4-with-LemonAPI
          path: |
            build/libs/BetterIDExtender-*.jar
            build/libs/LemonAPI-*.jar
          if-no-files-found: error
